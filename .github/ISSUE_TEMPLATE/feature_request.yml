name: Feature request
description: Suggest an addition or a change to the package.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This package deliberately stays small and framework-agnostic. Framework glue
        (Laravel, Symfony, …) belongs in an integration package, not here.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the use case, not the solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Can this be solved today with a custom `UrlStore` or `IndexNowClient`?
    validations:
      required: false

  - type: checkboxes
    id: breaking
    attributes:
      label: Compatibility
      options:
        - label: This change would break the public API.
          required: false
